name: "CodeQL Advanced"

# Erstatter GitHub sin "Default setup" for code scanning med samme konfigurasjon
# (språk, query-suite, threat-model, ukentlig schedule), men med økt JVM-minne
# for Java/Kotlin-bygget slik at CodeQL sin autobuild ikke går tom for heap.
#
# MERK: Dette trer kun i kraft dersom "Default setup" for code scanning
# slås av i Settings -> Code security and analysis (krever repo-admin).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 3 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Ingen "queries"/"config" angitt -> bruker standard "default" query-suite,
          # tilsvarende dagens Default setup-konfigurasjon.

      # Økt minne til Gradle/Kotlin-kompilatoren for java-kotlin-autobuild.
      # GRADLE_OPTS leses av gradlew-launcheren (gjelder også i --no-daemon-modus),
      # JAVA_TOOL_OPTIONS fanges opp av alle JVM-prosesser CodeQL sin tracer starter.
      - name: Set increased JVM memory for Java/Kotlin build
        if: matrix.language == 'java-kotlin'
        run: |
          echo "GRADLE_OPTS=-Xmx4g -XX:+UseG1GC" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Xmx4g" >> "$GITHUB_ENV"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
