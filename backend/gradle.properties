kotlin.code.style=official


# Økt minne til byggingen (påvirker ikke runtime). Kotlin-kompilatoren gikk tom for
# heap (OutOfMemoryError) under kodegenerering for den store @Serializable-klassen
# SolrDocument, noe som felte CodeQL sin autobuild. "in-process" kjører kompilatoren
# i Gradle-JVM-en i stedet for en separat Kotlin-daemon, slik at minneinnstillingen
# gjelder også når bygget kjøres med --no-daemon under CodeQL.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
kotlin.compiler.execution.strategy=in-process
